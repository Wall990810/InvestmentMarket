spring.application.name=im-observation

# 排除 DashScopeAgent 自动配置（测试只需要 ChatModel，不需要 DashScopeAgent）
spring.autoconfigure.exclude=com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration

# DashScope 配置
# API Key 通过环境变量 AI_DASHSCOPE_API_KEY 配置
spring.ai.dashscope.api-key=${AI_DASHSCOPE_API_KEY:}
spring.ai.dashscope.chat.model=qwen-plus
spring.ai.dashscope.chat.options.temperature=0.7
spring.ai.dashscope.chat.options.max-tokens=4096

# Langfuse 配置（通过环境变量配置）
# LANGFUSE_PUBLIC_KEY=pk-lf-xxx
# LANGFUSE_SECRET_KEY=sk-lf-xxx
# LANGFUSE_HOST=http://localhost:3000
